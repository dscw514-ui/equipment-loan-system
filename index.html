<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設備借還管理</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><h1>設備借還管理</h1><p>掃描 QR Code 即可借出或歸還</p></div><span>獨立設備借還網頁</span></header><nav><button data-tab="scan">借出／歸還</button><button data-tab="list">設備清單</button><button data-tab="admin">管理後台</button></nav><div id="msg" role="status"></div><section id="scan" class="panel"><h2>設備借還</h2><label>設備編碼<input id="code" placeholder="例如 EQ-0001"></label><button id="find">查詢設備</button><div id="device"></div><div id="action" hidden><label>操作人員姓名<input id="person" maxlength="80" autocomplete="name"></label><label>借用用途／歸還備註<input id="note" maxlength="500"></label><label id="dueLabel">預計歸還日期<input type="date" id="due"></label><button id="borrow">確認借出</button><button id="return">確認歸還</button></div></section><section id="list" class="panel" hidden><h2>設備清單</h2><div id="summary"></div><div class="tablewrap"><table><thead><tr><th>編碼</th><th>名稱</th><th>狀態</th><th>借用人</th><th>預計歸還</th><th>操作</th></tr></thead><tbody id="items"></tbody></table></div></section><section id="admin" class="panel" hidden><h2>管理員登入</h2><p>使用原設備保養系統的管理員帳號登入。</p><div id="login"><label>Email<input id="email" type="email"></label><label>密碼<input id="password" type="password"></label><button id="signIn">登入</button></div><div id="adminTools" hidden><button id="signOut">登出</button><h3>新增或修改設備</h3><label>設備編碼<input id="aCode"></label><label>設備名稱<input id="aName"></label><label>型號<input id="aModel"></label><label>存放位置<input id="aLocation"></label><label>備註<input id="aNotes"></label><button id="save">儲存設備</button><h3>CSV 匯入／匯出</h3><p>CSV 標題：code,name,model,location,notes</p><input id="csvFile" type="file" accept=".csv,text/csv"><button id="import">匯入 CSV</button><button id="export">匯出設備 CSV</button><h3>QR Code 批次列印</h3><button id="print">列印所有設備標籤</button><h3>借還歷史</h3><button id="historyRefresh">更新歷史</button><button id="historyExport">匯出歷史 CSV</button><div class="tablewrap"><table><thead><tr><th>設備</th><th>借用人</th><th>借出時間</th><th>預計歸還</th><th>歸還人</th><th>歸還時間</th></tr></thead><tbody id="history"></tbody></table></div></div></section></main><script type="module" src="app.js"></script></body></html>
