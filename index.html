<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>設備借還管理系統</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#182b40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#123b61;color:white;padding:18px max(16px,calc((100vw - 1080px)/2))}h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#c5e0f5}main{max-width:1080px;margin:22px auto;padding:0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:white;border-radius:12px;padding:16px;box-shadow:0 1px 5px #16395715}.stat strong{display:block;font-size:28px;color:#145b94}.stat span{font-size:13px;color:#52677a}.panel{margin-top:15px}h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:13px;margin:9px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #c5d2df;border-radius:7px;font:inherit;background:white}button,.filebtn{border:0;border-radius:7px;padding:10px 14px;background:#176ca9;color:white;cursor:pointer;font:inherit;display:inline-block}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e7eff7;color:#174a70}.danger{background:#b24b36}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e1e9ef;text-align:left;padding:10px;white-space:nowrap}th{background:#f2f6fa}.pill{padding:3px 8px;border-radius:99px;background:#e4f3e8;color:#1c713e;font-size:12px}.pill.borrowed{background:#fff1d6;color:#895c00}.pill.maintenance{background:#f5e3e1;color:#9b352c}.pill.overdue{background:#fce0df;color:#a32020}.muted{color:#607487;font-size:13px}.hidden{display:none!important}#message{padding:10px;border-radius:8px;margin:10px 0;background:#e6f3ff}#message.error{background:#ffe7e4;color:#a22120}.qrbox{text-align:center}.qrbox canvas{max-width:100%}.link{background:none;color:#1469a5;padding:4px;text-decoration:underline}#printArea{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.row{grid-template-columns:1fr}header{padding:16px}main{margin-top:12px}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .printlabel{border:1px solid #aaa;padding:12px;text-align:center;break-inside:avoid;font-size:13px}.printlabel canvas{width:130px;height:130px}}
</style></head><body><header><h1>設備借出／歸還管理</h1><p>手機掃描 QR Code · 即時狀態 · 完整歷史紀錄</p></header><main>
<div id="message" class="hidden"></div><section class="stats"><div class="stat"><strong id="total">0</strong><span>設備總數</span></div><div class="stat"><strong id="available">0</strong><span>可借用</span></div><div class="stat"><strong id="borrowed">0</strong><span>借出中</span></div><div class="stat"><strong id="overdue">0</strong><span>逾期未還</span></div></section>
<section class="panel"><div class="row"><div><label>操作人員姓名（免註冊）</label><input id="person" placeholder="請輸入姓名" maxlength="100"></div><div><label>設備搜尋／QR 掃描後自動定位</label><input id="search" placeholder="輸入編碼、名稱或型號"></div></div></section>
<div class="cols"><section class="panel"><h2>設備借出／歸還</h2><label>設備</label><select id="device"></select><div id="deviceInfo" class="muted"></div><label>預計歸還日期（借出時選填）</label><input id="due" type="datetime-local"><label>借用用途／備註</label><textarea id="note" rows="2" maxlength="1000"></textarea><div class="actions"><button id="checkout">確認借出</button><button id="return" class="secondary">確認歸還</button></div></section>
<section class="panel qrbox"><h2>設備專屬 QR Code</h2><div id="qrcode"></div><p id="qrUrl" class="muted" style="overflow-wrap:anywhere"></p><div class="actions" style="justify-content:center"><button id="downloadQr" class="secondary">下載 PNG</button><button id="printOne" class="secondary">列印標籤</button></div><p class="muted">QR Code 內含設備專屬網址，使用手機相機掃描即可開啟。</p></section></div>
<section class="panel"><h2>設備清單</h2><div class="actions"><button id="exportEquipment" class="secondary">匯出設備 CSV</button><label class="filebtn" for="importFile">匯入設備 CSV</label><input type="file" id="importFile" accept=".csv,text/csv" class="hidden"><button id="printAll" class="secondary">批次列印 QR Code</button></div><div class="tablewrap"><table><thead><tr><th>編碼</th><th>名稱</th><th>型號</th><th>位置</th><th>狀態</th><th>借用人</th><th>預計歸還</th><th>操作</th></tr></thead><tbody id="equipmentRows"></tbody></table></div></section>
<section class="panel"><h2>新增設備</h2><div class="row"><div><label>設備編碼</label><input id="newCode" placeholder="EQ-0001"></div><div><label>設備名稱</label><input id="newName" placeholder="絕緣電阻計"></div><div><label>型號</label><input id="newModel"></div><div><label>存放位置</label><input id="newLocation"></div></div><div class="actions"><button id="add">新增設備</button></div></section>
<section class="panel"><h2>借還歷史紀錄</h2><div class="row"><div><label>搜尋設備／人員</label><input id="historySearch" placeholder="搜尋編碼、借用人、歸還人"></div><div><label>狀態</label><select id="historyStatus"><option value="all">全部</option><option value="open">尚未歸還</option><option value="returned">已歸還</option><option value="overdue">逾期未還</option></select></div></div><div class="actions"><button id="exportHistory" class="secondary">匯出歷史 CSV</button></div><div class="tablewrap"><table><thead><tr><th>設備</th><th>借用人</th><th>借出時間</th><th>預計歸還</th><th>歸還人</th><th>歸還時間</th><th>備註</th></tr></thead><tbody id="historyRows"></tbody></table></div></section>
</main><div id="printArea"></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script><script src="app.js"></script></body></html>
